<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展示網站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <dialog id="entrance" class="entrance" tabindex="-1" autofocus aria-labelledby="entranceTitle" aria-describedby="entranceDescription">
        <div class="entrance-content">
            <h1 id="entranceTitle">文字</h1>
            <p id="entranceDescription">文字</p>
            <button id="enterExhibition" class="entrance-enter" type="button">
                <span class="entrance-prompt">Continue</span>
            </button>
            <p id="entranceMusicHint" class="entrance-hint" hidden>進入後將播放背景音樂，可隨時暫停。</p>
            <button id="enterQuietly" class="entrance-quiet" type="button" hidden>靜音進入</button>
        </div>
    </dialog>
    <!-- 選定授權音樂後，在 audio 加上 src="audio/background.mp3"。 -->
    <audio id="backgroundMusic" loop preload="none"></audio>

    <header class="site-header">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="開啟導覽選單" aria-controls="siteMenu" aria-expanded="false" onclick="openMenu()">
            <span></span><span></span><span></span>
        </button>
        <span class="current-page-label" id="currentPageLabel">節氣序章</span>
        <button id="musicToggle" class="music-toggle" type="button" aria-label="播放背景音樂" hidden>音樂 / 播放</button>
        <span id="musicStatus" class="music-status" role="status"></span>
    </header>

    <dialog id="siteMenu" class="site-menu" aria-labelledby="menuTitle">
        <div class="menu-panel">
            <div class="menu-heading">
                <p class="menu-eyebrow">COLLECTION / INDEX</p>
                <button class="menu-close" type="button" aria-label="關閉導覽選單" onclick="closeMenu()" autofocus>&times;</button>
            </div>
            
            <nav class="menu-navigation" aria-label="網站導覽">
                <button class="nav-btn active" type="button" data-page="intro" aria-current="page" onclick="switchPage('intro')">節氣序章<span class="menu-arrow" aria-hidden="true">↗</span></button>
                <button class="nav-btn" type="button" data-page="gallery" onclick="switchPage('gallery')">作品展示<span class="menu-arrow" aria-hidden="true">↗</span></button>
                <button class="nav-btn" type="button" data-page="text" onclick="switchPage('text')">繪師資訊<span class="menu-arrow" aria-hidden="true">↗</span></button>
                <button class="nav-btn" type="button" data-page="planning" onclick="switchPage('planning')">籌劃細節<span class="menu-arrow" aria-hidden="true">↗</span></button>
            </nav>
            
        </div>
    </dialog>

    <main>
        <!-- 節氣序章：Splash 之後先以文字建立企劃的世界觀，再進入作品展示。 -->
        <section id="intro-page" class="page-content intro-page active" aria-labelledby="introTitle">
            <div class="intro-layout">
                <div class="intro-copy">
                    <p class="intro-eyebrow">PROLOGUE · 二十四節氣</p>
                    <h1 id="introTitle">文字</h1>
                    <div class="intro-rule" aria-hidden="true"></div>
                    <p class="intro-lead">
                        文字
                    </p>
                    <p class="intro-description">
                        
                    </p>
                    <button class="intro-enter-gallery" type="button" onclick="switchPage('gallery')">
                        <span>委託作品</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>

                <div class="solar-cycle" aria-label="二十四節氣循環圖">
                    <div class="solar-ring" aria-hidden="true"></div>
                    <div class="solar-axis solar-axis-vertical" aria-hidden="true"></div>
                    <div class="solar-axis solar-axis-horizontal" aria-hidden="true"></div>


                    <span class="solar-term solar-spring" style="--angle:0deg">立春</span>
                    <span class="solar-term solar-spring" style="--angle:15deg">雨水</span>
                    <span class="solar-term solar-spring" style="--angle:30deg">驚蟄</span>
                    <span class="solar-term solar-spring" style="--angle:45deg">春分</span>
                    <span class="solar-term solar-spring" style="--angle:60deg">清明</span>

                    <span class="solar-term solar-summer" style="--angle:150deg">小暑</span>

                    <span class="solar-term solar-autumn" style="--angle:180deg">立秋</span>
                    <span class="solar-term solar-autumn" style="--angle:195deg">處暑</span>
                    <span class="solar-term solar-autumn" style="--angle:210deg">白露</span>
                    <span class="solar-term solar-autumn" style="--angle:225deg">秋分</span>
                    <span class="solar-term solar-autumn" style="--angle:240deg">寒露</span>
                    <span class="solar-term solar-autumn" style="--angle:255deg">霜降</span>
                    <span class="solar-term solar-winter" style="--angle:270deg">立冬</span>
                    <span class="solar-term solar-winter" style="--angle:285deg">小雪</span>
                    <span class="solar-term solar-winter" style="--angle:300deg">大雪</span>

                    <span class="solar-term solar-winter" style="--angle:330deg">小寒</span>
                    <span class="solar-term solar-winter" style="--angle:345deg">大寒</span>

                    <div class="solar-center" aria-hidden="true">
                        <span id="solarCenterTerm"></span>
                        <small id="solarCenterIndex"></small>
                        <p id="solarCenterNote"></p>
                    </div>
                </div>
            </div>
        </section>
