        </button>
        <span class="current-page-label" id="currentPageLabel">理時序</span>
        <button id="musicToggle" class="music-toggle" type="button" aria-label="播放背景音樂" hidden>音樂 / 播放</button>
        <span id="musicStatus" class="music-status" role="status"></span>
    </header>

    <dialog id="siteMenu" class="site-menu" aria-labelledby="menuTitle">
        <div class="menu-panel">
            <div class="menu-heading">

            </div>

                <button class="nav-btn active" type="button" data-page="intro" aria-current="page" onclick="switchPage('intro')">理時序<span class="menu-arrow" aria-hidden="true"></span></button>
                <button class="nav-btn" type="button" data-page="gallery" onclick="switchPage('gallery')">觀芳華<span class="menu-arrow" aria-hidden="true"></span></button>

                <button class="nav-btn" type="button" data-page="thanks" onclick="switchPage('thanks')">謝花人<span class="menu-arrow" aria-hidden="true"></span></button>
            </nav>
            
        </div>
    </dialog>

    <main>
        <!-- 理時序：Splash 之後先以文字建立企劃的世界觀，再進入作品展示。 -->
        <section id="intro-page" class="page-content intro-page active" aria-labelledby="introTitle">
            <div class="intro-layout">
                <div class="intro-copy">
                    <h1 id="introTitle">文字</h1>
                    <div class="intro-rule" aria-hidden="true"></div>
                    <p class="intro-lead">
                        兩維之間，九十一度也，十六分度之五，<br>
                        而升斗日行一度，十五日為一節，<br>
                        以生二十四時之變。
                    </p>
                    <p class="intro-description">
                        
                    </p>
                    <button class="intro-enter-gallery" type="button" onclick="switchPage('gallery')">
                        <span>觀芳華</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>

                <div class="solar-cycle" aria-label="二十四節氣循環圖">

                    <div class="solar-axis solar-axis-horizontal" aria-hidden="true"></div>
